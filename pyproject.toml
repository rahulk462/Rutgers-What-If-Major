[project]
name = "rutgers-whatif"
version = "0.1.0"
description = "Personal Degree Navigator what-if tool for Rutgers New Brunswick"
requires-python = ">=3.10"
dependencies = ["playwright>=1.45", "httpx>=0.27", "beautifulsoup4>=4.12"]

[project.scripts]
rwi = "rutgers_whatif.cli:main"

[tool.setuptools.packages.find]
include = ["rutgers_whatif*"]

[tool.setuptools.package-data]
rutgers_whatif = ["programs/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
